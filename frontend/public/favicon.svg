  <line x1="9.5" y1="16" x2="22.5" y2="16" stroke="#F6F3EC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13.5" y1="19" x2="18.5" y2="19" stroke="#F6F3EC" stroke-width="1.5" stroke-linecap="round"/>
</svg>